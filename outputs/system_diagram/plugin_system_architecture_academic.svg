<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .bg{fill:#ffffff}.band{fill:#f7f9fc;stroke:#d6deea;stroke-width:1.4}.box{fill:#ffffff;stroke:#24364b;stroke-width:1.6;rx:8}.soft{fill:#eef4fb;stroke:#58708f;stroke-width:1.3;rx:8}.plugin{fill:#f8fbf7;stroke:#5c7a62;stroke-width:1.5;rx:8}.artifact{fill:#fffaf0;stroke:#9b7a35;stroke-width:1.4;rx:8}.txt{font-family:Arial,Helvetica,sans-serif;fill:#17212f}.title{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#42526a}.cap{font-size:13px;font-weight:700;fill:#42526a}.solid{stroke:#24364b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.dash{stroke:#5c7a62;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#arrowGreen)}.thin{stroke:#9aa8ba;stroke-width:1.2;fill:none}.label{font-size:12px;fill:#42526a}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#24364b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5c7a62"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="820"/>
  <text class="txt title" x="700" y="42" text-anchor="middle">Plug-and-Play Federated Learning Plugin Architecture</text>

  <rect class="band" x="70" y="90" width="1260" height="560" rx="14"/>
  <text class="txt cap" x="95" y="120">FEDAVG BASELINE TRAINING SKELETON</text>

  <rect class="box" x="115" y="155" width="280" height="175"/>
  <text class="txt h" x="255" y="188" text-anchor="middle">Server Controller</text>
  <text class="txt m" x="255" y="218" text-anchor="middle">FedAvgTrainer / BaseFederated</text>
  <text class="txt s" x="255" y="250" text-anchor="middle">client sampling</text>
  <text class="txt s" x="255" y="274" text-anchor="middle">global model broadcast</text>
  <text class="txt s" x="255" y="298" text-anchor="middle">weighted model aggregation</text>

  <rect class="box" x="505" y="155" width="335" height="175"/>
  <text class="txt h" x="672" y="188" text-anchor="middle">Client Training Skeleton</text>
  <text class="txt m" x="672" y="218" text-anchor="middle">BaseClient, replicated over selected clients</text>
  <text class="txt s" x="672" y="250" text-anchor="middle">local model replica</text>
  <text class="txt s" x="672" y="274" text-anchor="middle">task loss and optimizer step</text>
  <text class="txt s" x="672" y="298" text-anchor="middle">returns weights and sample count</text>

  <rect class="artifact" x="935" y="155" width="290" height="175"/>
  <text class="txt h" x="1080" y="188" text-anchor="middle">Federated Update Object</text>
  <text class="txt m" x="1080" y="218" text-anchor="middle">{ weights, num_samples, aux }</text>
  <text class="txt s" x="1080" y="250" text-anchor="middle">weights: FedAvg main channel</text>
  <text class="txt s" x="1080" y="274" text-anchor="middle">aux: plugin-private channel</text>
  <text class="txt s" x="1080" y="298" text-anchor="middle">baseline remains valid when aux is empty</text>

  <path class="solid" d="M395 223 C440 213 460 213 505 223"/>
  <text class="txt label" x="450" y="202" text-anchor="middle">model parameters</text>
  <path class="solid" d="M840 242 C875 242 900 242 935 242"/>
  <text class="txt label" x="888" y="224" text-anchor="middle">local update</text>
  <path class="solid" d="M935 295 C615 420 410 405 275 330"/>
  <text class="txt label" x="640" y="406" text-anchor="middle">weighted aggregation of model weights</text>

  <rect class="band" x="115" y="390" width="1110" height="210" rx="14"/>
  <text class="txt cap" x="140" y="420">PLUGIN PROTOCOL AND IMPLEMENTATION LAYER</text>

  <rect class="soft" x="155" y="455" width="245" height="105"/>
  <text class="txt h" x="278" y="485" text-anchor="middle">Plugin Resolution</text>
  <text class="txt s" x="278" y="514" text-anchor="middle">configuration</text>
  <text class="txt s" x="278" y="537" text-anchor="middle">registry and factory</text>

  <rect class="plugin" x="505" y="445" width="255" height="125"/>
  <text class="txt h" x="633" y="476" text-anchor="middle">Client Plugin Interface</text>
  <text class="txt s" x="633" y="506" text-anchor="middle">on_round_start</text>
  <text class="txt s" x="633" y="529" text-anchor="middle">train_batch</text>
  <text class="txt s" x="633" y="552" text-anchor="middle">build_upload_payload</text>

  <rect class="plugin" x="875" y="445" width="255" height="125"/>
  <text class="txt h" x="1003" y="476" text-anchor="middle">Server Plugin Interface</text>
  <text class="txt s" x="1003" y="506" text-anchor="middle">build_broadcast_payload</text>
  <text class="txt s" x="1003" y="529" text-anchor="middle">aggregate_client_payloads</text>
  <text class="txt s" x="1003" y="552" text-anchor="middle">maintain plugin state</text>

  <path class="dash" d="M400 507 C440 507 465 507 505 507"/>
  <path class="dash" d="M760 507 C800 507 835 507 875 507"/>
  <text class="txt label" x="818" y="489" text-anchor="middle">aux payload contract</text>

  <path class="dash" d="M632 445 C650 405 655 365 660 330"/>
  <text class="txt label" x="702" y="388">hooks local batch training</text>
  <path class="dash" d="M1002 445 C1040 405 1060 365 1070 330"/>
  <text class="txt label" x="1115" y="388">reads aux, emits payload</text>

  <rect class="plugin" x="245" y="690" width="910" height="80"/>
  <text class="txt h" x="700" y="722" text-anchor="middle">FedFed Plugin Folder</text>
  <text class="txt m" x="700" y="750" text-anchor="middle">client-side auxiliary representation learning + server-side shared state aggregation, attached without changing the FedAvg model-weight path</text>

  <path class="dash" d="M633 570 C640 625 655 660 690 690"/>
  <path class="dash" d="M1003 570 C980 625 930 660 850 690"/>
  <rect x="90" y="680" width="175" height="1.5" fill="#24364b"/>
  <text class="txt s" x="282" y="685">solid: FedAvg model path</text>
  <line x1="90" y1="720" x2="265" y2="720" stroke="#5c7a62" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text class="txt s" x="282" y="725">dashed: plugin auxiliary path</text>
</svg>
